name: Build
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        default: "com.dts.freefiremax"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: gradle
    - run: |
        chmod +x ./gradlew
        PKG_NAME="${{ github.event.inputs.package_name }}"
        if [ -z "$PKG_NAME" ]; then
          PKG_NAME="com.dts.freefiremax"
        fi
        echo "Building for package: $PKG_NAME"
        sed -i "s/moduleDescription = \"/moduleDescription = \"($PKG_NAME) /g" module.gradle
        sed -i "s/#define GamePackageName .*/#define GamePackageName \"$PKG_NAME\"/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: out/magisk_module_release/
